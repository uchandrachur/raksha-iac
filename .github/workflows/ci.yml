name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check raksha tests

      - name: Type check
        run: mypy raksha
        continue-on-error: true

      - name: Tests
        run: pytest --cov=raksha --cov-report=term-missing

      - name: Self-scan (verify CLI works)
        run: raksha scan examples/bad.tf --rules generic,dpdpa,rbi --severity-threshold INFO || true
