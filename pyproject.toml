[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raksha-iac"
version = "0.1.0"
description = "Terraform security scanner with India-specific (DPDPA, RBI) compliance rules and AI-augmented remediation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Uma Dayal Chandrachur", email = "umadayal@hotmail.com" }
]
keywords = ["terraform", "iac", "security", "dpdpa", "rbi", "compliance", "cloud-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "python-hcl2>=4.3.0",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.34",
  "openai>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
raksha = "raksha.cli:app"

[project.urls]
Homepage = "https://github.com/umadayal/raksha-iac"
Repository = "https://github.com/umadayal/raksha-iac"
Issues = "https://github.com/umadayal/raksha-iac/issues"

[tool.setuptools.packages.find]
include = ["raksha*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
